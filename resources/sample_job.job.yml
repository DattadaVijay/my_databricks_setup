# A sample job for feature_bundle.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "scikit-learn"
              - "databricks-feature-engineering"
              - "mlflow"

      tasks:
        - task_key: transaction_data_computation
          pipeline_task:
            pipeline_id: ${resources.pipelines.feature_bundle_etl.id}
            full_refresh: true
        - task_key: feature_tables
          depends_on: 
            - task_key: transaction_data_computation
          environment_key: default
          notebook_task:
            notebook_path: ../src/feature_bundle/features.py
        - task_key: batch_inference
          depends_on:
            - task_key: feature_tables
          environment_key: default
          notebook_task:
            notebook_path: ../src/feature_bundle/batch_predictions.py

        - task_key: auto_tagging
          depends_on: 
            - task_key: batch_inference
          environment_key: default
          notebook_task:
            notebook_path: ../src/contracts/sync.py
            base_parameters:
              contract_path: ${workspace.file_path}/src/contracts/datacontract.yaml