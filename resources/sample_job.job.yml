# A sample job for feature_bundle.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "scikit-learn"
              - "databricks-feature-engineering"
              - "mlflow"

      tasks:
        - task_key: transaction_data_computation
          pipeline_task:
            pipeline_id: ${resources.pipelines.feature_bundle_etl.id}
            full_refresh: true
        - task_key: feature_tables
          notebook_task:
            notebook_path: ../src/feature_bundle/