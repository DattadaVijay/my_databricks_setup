# A sample job for feature_bundle.

resources:
  jobs:
    sample_job:
      name: sample_job

      trigger:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: transaction_data_computation
          environmnet_key: default
          pipeline_task:
            pipeline_id: ${resources.pipelines.feature_bundle_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "scikit-learn"
              - "databricks-feature-engineering"
              - "mlflow"
